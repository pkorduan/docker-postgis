#######################################
# pgBackRest – für alle Server gleich
#
# repo1: lokal, kurze RTO, wenig Platz
#   1 Full (am 1.) + tägliche Incrementals, WAL nur ab dem letzten Backup (PITR ~ 1 Tag)
# repo2: Tier2 per SFTP, lange Retention – nur wenn /etc/pgbackrest/host/*.conf vorhanden (./config/pgbackrest)
#   (Vorlage: config.example/pgbackrest/repo2.conf, eingerichtet von server-konfig Rolle pgsql-container)
#
# Hier keine repo2-*-Optionen eintragen: jede repo2-Option legt repo2 an, auch ohne repo2-type
#######################################

[global]
start-fast=y
compress-type=zst
log-level-console=info

# WAL asynchron schieben; ist repo2 weg, wächst pg_wal höchstens bis archive-push-queue-max,
# danach wird WAL verworfen (Lücke im Archiv bis zum nächsten Backup) statt die Platte zu füllen.
# Pro Host überschreibbar per Umgebungsvariable PGBACKREST_ARCHIVE_PUSH_QUEUE_MAX
archive-async=y
archive-push-queue-max=16GiB

repo1-path=/pgbackrest
repo1-bundle=y
repo1-block=y
repo1-retention-full-type=count
repo1-retention-full=1
repo1-retention-archive-type=incr
repo1-retention-archive=1

[local]
pg1-path=/var/lib/postgresql/data
pg1-user=postgres
